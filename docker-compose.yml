services:

  postgres:

    image: postgres:16

    container_name: erp_postgres

    restart: always

    environment:

      POSTGRES_USER: erp

      POSTGRES_PASSWORD: geheim

      POSTGRES_DB: erp

    ports:

      - "5432:5432"

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]

      interval: 5s

      timeout: 5s

      retries: 12

    volumes:

      - postgres_data:/var/lib/postgresql/data

      - ./database/init:/docker-entrypoint-initdb.d:ro


  pgadmin:

    image: dpage/pgadmin4

    container_name: erp_pgadmin

    restart: always

    environment:

      PGADMIN_DEFAULT_EMAIL: admin@test.de

      PGADMIN_DEFAULT_PASSWORD: admin

      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

      PGPASS_FILE: /pgpassfile

    ports:

      - "5050:80"

    volumes:

      - pgadmin_data:/var/lib/pgadmin

      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

      - ./docker/pgadmin/pgpassfile:/pgpassfile:ro


  backend:

    build: ./backend

    container_name: erp_backend

    environment:

      DATABASE_DSN: dbname=erp user=erp password=geheim host=postgres port=5432

      ERP_SECRET_KEY: erp-docker-secret

      ERP_CORS_ORIGINS: "*"

      ERP_SERVER_CONFIG_PATH: /app_data/server-config.json

    ports:

      - "5000:5000"

    restart: unless-stopped

    volumes:

      - backend_app_data:/app_data

    develop:

      watch:

        - action: sync+restart

          path: ./backend

          target: /app

          ignore:

            - __pycache__/

            - .pytest_cache/

            - .mypy_cache/

            - venv/

            - .venv/

        - action: rebuild

          path: ./backend/requirements.txt

        - action: rebuild

          path: ./backend/Dockerfile

    depends_on:

      postgres:

        condition: service_healthy


  frontend:

    build: ./frontend

    container_name: erp_frontend

    ports:

      - "5173:5173"

    volumes:

      - /app/node_modules

    develop:

      watch:

        - action: sync

          path: ./frontend

          target: /app

          ignore:

            - node_modules/

            - dist/

        - action: rebuild

          path: ./frontend/package.json

        - action: rebuild

          path: ./frontend/package-lock.json

        - action: rebuild

          path: ./frontend/Dockerfile

    command: >
      sh -c "npm install &&
         npm run dev -- --host &&
         echo 'Frontend IP Address: http://$(hostname -I | awk \"{print \$1}\"):5173'"
    depends_on:

      - backend


volumes:

  postgres_data:

  pgadmin_data:

  backend_app_data:
