services:

  postgres:

    image: postgres:16

    container_name: erp_postgres

    restart: always

    environment:

      POSTGRES_USER: erp

      POSTGRES_PASSWORD: geheim

      POSTGRES_DB: erp

    ports:

      - "5432:5432"

    volumes:

      - ./database/data:/var/lib/postgresql/data

      - ./database/init:/docker-entrypoint-initdb.d:ro


  pgadmin:

    image: dpage/pgadmin4

    container_name: erp_pgadmin

    restart: always

    environment:

      PGADMIN_DEFAULT_EMAIL: admin@test.de

      PGADMIN_DEFAULT_PASSWORD: admin

      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"

      PGPASS_FILE: /pgpassfile

    ports:

      - "5050:80"

    volumes:

      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

      - ./docker/pgadmin/pgpassfile:/pgpassfile:ro


  backend:

    build: ./backend

    container_name: erp_backend

    environment:

      ERP_DATA_MODE: postgres

      DATABASE_DSN: dbname=erp user=erp password=geheim host=postgres port=5432

    ports:

      - "5000:5000"

    volumes:

      - ./backend:/app

    depends_on:

      - postgres


  frontend:

    build: ./frontend

    container_name: erp_frontend

    ports:

      - "5173:5173"

    volumes:

      - ./frontend:/app

      - /app/node_modules

    command: sh -c "npm install && npm run dev -- --host"

    depends_on:

      - backend
