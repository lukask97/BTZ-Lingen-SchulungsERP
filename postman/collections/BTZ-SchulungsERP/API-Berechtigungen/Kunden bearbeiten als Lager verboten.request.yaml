$kind: http-request
url: "{{dbBaseUrl}}/kunden/{{kundeId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "notiz": "Postman 403 Lager Test {{requestTimestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', function () {
        pm.response.to.have.status(403);
      });
      const data = pm.response.json();
      pm.test('Lager darf Kunden nicht bearbeiten', function () {
        pm.expect(data.ok).to.eql(false);
        pm.expect(data.message).to.include('Keine Berechtigung');
        pm.expect(data.message).to.include('kunden');
      });
    language: text/javascript
order: 4500
