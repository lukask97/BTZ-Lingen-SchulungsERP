$kind: http-request
url: "{{dbBaseUrl}}/kunden"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', function () {
        pm.response.to.have.status(401);
      });
      const data = pm.response.json();
      pm.test('Antwort meldet fehlende Anmeldung', function () {
        pm.expect(data.ok).to.eql(false);
        pm.expect(data.message).to.include('Nicht angemeldet');
      });
    language: text/javascript
order: 2000
