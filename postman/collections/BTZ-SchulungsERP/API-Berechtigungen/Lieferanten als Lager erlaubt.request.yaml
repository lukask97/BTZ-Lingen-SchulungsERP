$kind: http-request
url: "{{dbBaseUrl}}/lieferanten"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Lieferantenliste geladen', function () {
        pm.expect(Array.isArray(data.items)).to.eql(true);
        pm.expect(data.provider).to.eql('postgres');
      });
    language: text/javascript
order: 5000
