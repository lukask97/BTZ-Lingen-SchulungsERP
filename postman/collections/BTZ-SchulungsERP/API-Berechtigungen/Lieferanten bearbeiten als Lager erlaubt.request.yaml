$kind: http-request
url: "{{dbBaseUrl}}/lieferanten/1"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fuerBts": "Postman Lager Bearbeitung {{requestTimestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Lager darf Lieferanten bearbeiten', function () {
        pm.expect(data.ok).to.eql(true);
        pm.expect(data.item.id).to.eql(1);
        pm.expect(data.item.fuerBts).to.include('Postman Lager Bearbeitung');
      });
    language: text/javascript
order: 5500
