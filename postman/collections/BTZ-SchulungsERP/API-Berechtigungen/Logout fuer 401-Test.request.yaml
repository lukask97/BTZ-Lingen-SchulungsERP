$kind: http-request
url: "{{baseUrl}}/auth/logout"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Logout erfolgreich', function () {
        pm.expect(data.ok).to.eql(true);
      });
    language: text/javascript
order: 1000
