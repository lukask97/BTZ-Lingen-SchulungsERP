$kind: http-request
url: "{{baseUrl}}/reset"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 403', function () {
        pm.response.to.have.status(403);
      });
      const data = pm.response.json();
      pm.test('Reset ist fuer Lager gesperrt', function () {
        pm.expect(data.ok).to.eql(false);
        pm.expect(data.message).to.include('gf.bearbeiten');
      });
    language: text/javascript
order: 6000
