$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Keine Session aktiv', function () {
        pm.expect(data.authenticated).to.eql(false);
        pm.expect(data.user).to.eql(null);
      });
    language: text/javascript
order: 1500
