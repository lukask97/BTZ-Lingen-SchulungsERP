$kind: http-request
url: "{{dbBaseUrl}}/kundenanfragen"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Kundenanfragen vorhanden', function () {
        pm.expect(Array.isArray(data.items)).to.eql(true);
      });
      if (data.items.length > 0) {
        pm.environment.set('anfrageId', String(data.items[0].id));
        pm.environment.set('vorgangId', String(data.items[0].vorgangId || ''));
      }
    language: text/javascript
order: 1000
