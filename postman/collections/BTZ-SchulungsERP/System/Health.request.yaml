$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('API ist gesund', function () {
        pm.expect(data.status).to.eql('ok');
      });
    language: text/javascript
order: 1000
