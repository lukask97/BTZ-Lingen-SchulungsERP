$kind: http-request
url: "{{baseUrl}}/meta"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      pm.test('Postgres-Modus aktiv', function () {
        pm.expect(data.mode).to.eql('postgres');
      });
    language: text/javascript
order: 2000
